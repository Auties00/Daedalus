# Root (English) messages of the Protocol Buffer compiler.
#
# Every value is a java.text.MessageFormat pattern:
#   - a literal apostrophe is written as ''
#   - a literal brace is written as '{' or '}'
#   - integers are formatted with {n,number,#} so that no grouping separator is inserted
#
# Every message is made of up to three parts:
#   - the headline, a single line without a final period that states what is wrong and names the
#     offending token or declaration
#   - an optional explanation, separated from the headline by an empty line, that states the rule
#     that was broken and why it exists
#   - the help, stored under the key of the message followed by ".help", that tells how to fix the
#     problem, usually followed by a valid example
#
# Style conventions:
#   - tokens, names and keywords are quoted with single quotes: 'message', 'user_name'
#   - types and values are not quoted, except string values, which use double quotes like in a
#     .proto file: int32, 42, "proto3"
#   - continuation lines of the help are indented by 6 spaces, so that they align with the text that
#     follows "Help: ", and example code is indented by 8 spaces
#   - "field number" is used for the numbers of fields, "value" for the numbers of enum constants

# Rendering
diagnostic.format={0}:{1}:{2}: {3}: {4}
diagnostic.format.nopos={0}: {1}: {2}
diagnostic.location.input=<input>
diagnostic.help=Help: {0}
diagnostic.count={0,choice,1#1 error|1<{0,number,#} errors}
diagnostic.kind.lexical=lexical error
diagnostic.kind.syntax=syntax error
diagnostic.kind.semantic=semantic error

# Lexical errors
lexical.unterminated.string=Unterminated string literal\n\nThe string starts on this line but is not closed before the end of the line. A string literal cannot span multiple lines.
lexical.unterminated.string.help=Add the missing closing quote. To split a long value across lines, write several adjacent string\n      literals: they are concatenated automatically.\n      Example:\n        option java_package = "com.example."\n                              "api";

# Syntax errors
syntax.unexpected.end.of.input=Unexpected end of file\n\nThe file ended while a declaration was still open. This usually means that a closing brace or a semicolon is missing.
syntax.unexpected.end.of.input.help=Check that every opening brace has a matching closing brace and that every statement ends with\n      a semicolon.\n      Example:\n        message Person '{'\n          string name = 1;\n        '}'
syntax.expected.token=Expected ''{0}'' but found ''{1}''
syntax.expected.token.help=Insert ''{0}'' before ''{1}''. If ''{0}'' is already there, check the preceding tokens for a typo or\n      for a declaration that was not completed.
syntax.unexpected.token=Unexpected token ''{0}''
syntax.unexpected.token.help=Remove ''{0}'', or check that the declaration before it is complete and correctly spelled.
syntax.expected.separator.or.semicolon=Expected '','' or '';'' but found ''{0}''\n\nThe values of a reserved or extensions declaration must be separated by commas, and the declaration must end with a semicolon.
syntax.expected.separator.or.semicolon.help=Separate the values with commas and end the list with a semicolon.\n      Examples:\n        reserved 2, 15, 9 to 11;\n        extensions 100 to 199, 500;
syntax.unexpected.top.level.token=Unexpected token ''{0}'' at the top level of the file\n\nOnly these declarations can appear at the top level: ''syntax'', ''edition'', ''package'', ''import'', ''option'', ''message'', ''enum'', ''service'' and ''extend''. Edition 2024 also allows ''export'' and ''local''.
syntax.unexpected.top.level.token.help=If ''{0}'' starts a field, move the field inside a message. If it is a misspelled keyword, correct\n      it. If it follows another declaration, check that the previous declaration is closed with a\n      semicolon or a closing brace.\n      Example:\n        message Person '{'\n          string name = 1;\n        '}'
syntax.expected.message.or.enum.after.visibility=Expected ''message'' or ''enum'' after ''{0}'' but found ''{1}''\n\nThe visibility modifiers ''export'' and ''local'' can only be applied to message and enum declarations.
syntax.expected.message.or.enum.after.visibility.help=Place ''{0}'' directly before a message or an enum declaration, or remove it.\n      Example:\n        {0} message Person '{'\n          string name = 1;\n        '}'
syntax.invalid.package.name=Invalid package name ''{0}''\n\nA package name is a sequence of identifiers separated by single dots. Each identifier must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.package.name.help=Remove leading, trailing or repeated dots and any other invalid character. By convention, package\n      names are lowercase and start with the reversed domain name of the project.\n      Example:\n        package com.example.api;
syntax.expected.semicolon.after.package=Expected '';'' after the package name but found ''{0}''
syntax.expected.semicolon.after.package.help=End the package declaration with a semicolon.\n      Example:\n        package com.example.api;
syntax.expected.assignment.after.syntax=Expected ''='' after ''syntax'' but found ''{0}''
syntax.expected.assignment.after.syntax.help=A syntax declaration assigns the version with ''=''.\n      Example:\n        syntax = "proto3";
syntax.expected.syntax.literal=Expected the syntax version as a quoted string but found ''{0}''
syntax.expected.syntax.literal.help=Write the version between double quotes.\n      Example:\n        syntax = "proto3";
syntax.unknown.syntax.version=Unknown syntax version "{0}"\n\nThe supported syntax versions are "proto2" and "proto3".
syntax.unknown.syntax.version.help=Use one of the supported versions. If "{0}" is meant to be an edition, declare it with an\n      edition statement instead.\n      Examples:\n        syntax = "proto3";\n        edition = "2023";
syntax.expected.semicolon.after.syntax=Expected '';'' after the syntax declaration but found ''{0}''
syntax.expected.semicolon.after.syntax.help=End the syntax declaration with a semicolon.\n      Example:\n        syntax = "proto3";
syntax.expected.assignment.after.edition=Expected ''='' after ''edition'' but found ''{0}''
syntax.expected.assignment.after.edition.help=An edition declaration assigns the edition with ''=''.\n      Example:\n        edition = "2023";
syntax.expected.edition.literal=Expected the edition as a quoted string but found ''{0}''
syntax.expected.edition.literal.help=Write the edition between double quotes.\n      Example:\n        edition = "2023";
syntax.unknown.edition=Unknown edition "{0}"\n\nThe supported editions are "2023" and "2024".
syntax.unknown.edition.help=Use one of the supported editions. If "{0}" is meant to be a syntax version, such as "proto3",\n      declare it with a syntax statement instead.\n      Examples:\n        edition = "2024";\n        syntax = "proto3";
syntax.expected.semicolon.after.edition=Expected '';'' after the edition declaration but found ''{0}''
syntax.expected.semicolon.after.edition.help=End the edition declaration with a semicolon.\n      Example:\n        edition = "2023";
syntax.expected.semicolon.after.option=Expected '';'' after the option value but found ''{0}''
syntax.expected.semicolon.after.option.help=End the option declaration with a semicolon. If the value is a string, check that it is closed\n      by a double quote.\n      Example:\n        option java_package = "com.example.api";
syntax.expected.extension.name.end=Expected '')'' to close the name of the custom option but found ''{0}''\n\nThe name of a custom option, which is defined by an extension, must be enclosed in parentheses.
syntax.expected.extension.name.end.help=Close the parentheses right after the name of the extension. The fields of a custom option are\n      selected after the closing parenthesis.\n      Examples:\n        option (my_option) = true;\n        option (my_option).enabled = true;
syntax.expected.assignment.after.option.name=Expected ''='' after the option name but found ''{0}''
syntax.expected.assignment.after.option.name.help=An option assigns its value with ''=''. The names of custom options must be enclosed in parentheses.\n      Examples:\n        option java_package = "com.example.api";\n        option (my_option) = true;
syntax.invalid.message.name=Invalid message name ''{0}''\n\nA message name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.message.name.help=Rename the message. By convention, message names use PascalCase.\n      Example:\n        message UserProfile '{'\n          string name = 1;\n        '}'
syntax.expected.message.body.start=Expected '''{''' to start the body of the message but found ''{0}''
syntax.expected.message.body.start.help=Open the body of the message with a brace right after its name, even if the message has no fields.\n      Example:\n        message Person '{'\n          string name = 1;\n          int32 age = 2;\n        '}'
syntax.invalid.extend.target=Invalid type name ''{0}'' in extend declaration\n\nThe target of an extend declaration must be the name of a message, optionally qualified with its package.
syntax.invalid.extend.target.help=Write the name of the message to extend, without quotes.\n      Examples:\n        extend Person '{' ... '}'\n        extend google.protobuf.FieldOptions '{' ... '}'
syntax.expected.extend.body.start=Expected '''{''' to start the body of the extend declaration but found ''{0}''
syntax.expected.extend.body.start.help=Open the body with a brace and declare the extension fields inside it.\n      Example:\n        extend Person '{'\n          optional string nickname = 100;\n        '}'
syntax.invalid.map.key.type=Invalid map key type ''{0}''\n\nThe first type parameter of a map must be the name of its key type.
syntax.invalid.map.key.type.help=A map field is declared as: map<KeyType, ValueType> name = number;\n      Example:\n        map<string, int32> scores = 1;
syntax.expected.map.type.separator=Expected '','' between the key and the value types of the map but found ''{0}''
syntax.expected.map.type.separator.help=Separate the key type from the value type with a comma.\n      Example:\n        map<string, int32> scores = 1;
syntax.invalid.map.value.type=Invalid map value type ''{0}''\n\nThe second type parameter of a map must be the name of its value type.
syntax.invalid.map.value.type.help=A map field is declared as: map<KeyType, ValueType> name = number;\n      Example:\n        map<string, Person> people = 1;
syntax.expected.map.type.end=Expected ''>'' to close the type parameters of the map but found ''{0}''
syntax.expected.map.type.end.help=A map declares exactly two type parameters, the key type and the value type, enclosed in angle\n      brackets.\n      Example:\n        map<string, int32> scores = 1;
syntax.invalid.field.name=Invalid field name ''{0}''\n\nA field name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.field.name.help=Rename the field, or add its name if it is missing. A field is declared as: type name = number;\n      By convention, field names use lower_snake_case.\n      Example:\n        string user_name = 1;
syntax.expected.assignment.after.field.name=Expected ''='' after the field name but found ''{0}''
syntax.expected.assignment.after.field.name.help=Assign a field number with ''=''. A field is declared as: type name = number;\n      Example:\n        string user_name = 1;
syntax.expected.field.number=Expected a field number but found ''{0}''\n\nEvery field must be assigned a positive integer, called its field number, that identifies it in the binary encoding.
syntax.expected.field.number.help=Assign a number that is unique within the message. Numbers from 1 to 15 take a single byte to\n      encode, so use them for the fields that are set most often.\n      Example:\n        string user_name = 1;
syntax.invalid.enum.name=Invalid enum name ''{0}''\n\nAn enum name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.enum.name.help=Rename the enum. By convention, enum names use PascalCase.\n      Example:\n        enum Status '{'\n          STATUS_UNSPECIFIED = 0;\n        '}'
syntax.expected.enum.constant.number=Expected the value of the enum constant but found ''{0}''\n\nEvery enum constant must be assigned an integer value.
syntax.expected.enum.constant.number.help=Assign an integer to the constant with ''=''.\n      Example:\n        enum Status '{'\n          STATUS_UNSPECIFIED = 0;\n          STATUS_ACTIVE = 1;\n        '}'
syntax.expected.integer.value=Expected a field number but found ''{0}''\n\nAn extensions declaration lists the field numbers, or the ranges of field numbers, that are available to extensions.
syntax.expected.integer.value.help=List field numbers or ranges separated by commas.\n      Example:\n        extensions 100 to 199, 500;
syntax.expected.range.end=Expected a number or ''max'' after ''to'' but found ''{0}''
syntax.expected.range.end.help=A range is written as: start to end, where end is a number or ''max'' for the largest valid\n      number.\n      Examples:\n        reserved 9 to 11;\n        extensions 1000 to max;
syntax.expected.reserved.value=Expected a number, a range or a name but found ''{0}''\n\nA reserved declaration lists either numbers and ranges, or names.
syntax.expected.reserved.value.help=Names are quoted in proto2 and proto3 files, and unquoted in files that use editions. Numbers\n      and names cannot be mixed in the same declaration.\n      Examples:\n        reserved 2, 15, 9 to 11;\n        reserved "foo", "bar";\n        reserved foo, bar;
syntax.invalid.service.name=Invalid service name ''{0}''\n\nA service name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.service.name.help=Rename the service. By convention, service names use PascalCase.\n      Example:\n        service UserService '{'\n          rpc GetUser(GetUserRequest) returns (User);\n        '}'
syntax.unexpected.service.token=Expected ''rpc'' or ''option'' in the body of the service but found ''{0}''\n\nA service can only contain methods and options.
syntax.unexpected.service.token.help=Declare methods with the ''rpc'' keyword. Messages and enums must be declared outside of the\n      service.\n      Example:\n        service UserService '{'\n          rpc GetUser(GetUserRequest) returns (User);\n        '}'
syntax.invalid.method.name=Invalid method name ''{0}''\n\nA method name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.method.name.help=Rename the method. By convention, method names use PascalCase.\n      Example:\n        rpc GetUser(GetUserRequest) returns (User);
syntax.expected.returns=Expected ''returns'' after the request type but found ''{0}''
syntax.expected.returns.help=A method is declared as: rpc Name(RequestType) returns (ResponseType);\n      Example:\n        rpc GetUser(GetUserRequest) returns (User);
syntax.unexpected.method.body.token=Expected ''option'' in the body of the method but found ''{0}''\n\nThe body of a method can only contain options.
syntax.unexpected.method.body.token.help=Move ''{0}'' outside of the method. If the method has no options, end it with a semicolon\n      instead of a body.\n      Examples:\n        rpc GetUser(GetUserRequest) returns (User);\n        rpc GetUser(GetUserRequest) returns (User) '{'\n          option deprecated = true;\n        '}'
syntax.expected.method.body.or.semicolon=Expected '''{''' or '';'' after the method but found ''{0}''
syntax.expected.method.body.or.semicolon.help=End the method with a semicolon, or open a body to declare its options.\n      Examples:\n        rpc GetUser(GetUserRequest) returns (User);\n        rpc GetUser(GetUserRequest) returns (User) '{'\n          option deprecated = true;\n        '}'
syntax.invalid.method.type=Invalid method type ''{0}''\n\nThe request and the response of a method must be message names, optionally preceded by ''stream''.
syntax.invalid.method.type.help=Write the name of a message between the parentheses.\n      Examples:\n        rpc GetUser(GetUserRequest) returns (User);\n        rpc WatchUsers(WatchUsersRequest) returns (stream User);
syntax.invalid.oneof.name=Invalid oneof name ''{0}''\n\nA oneof name must be an identifier: it must start with a letter or an underscore and contain only letters, digits and underscores.
syntax.invalid.oneof.name.help=Rename the oneof. By convention, oneof names use lower_snake_case.\n      Example:\n        oneof result '{'\n          string value = 1;\n          string error = 2;\n        '}'
syntax.unknown.import.modifier=Unknown import modifier ''{0}''\n\nAn import is followed either by the quoted path of the imported file or by one of the modifiers ''public'' and ''weak'', or ''option'' in edition 2024.
syntax.unknown.import.modifier.help=Quote the path of the imported file, or use a supported modifier.\n      Examples:\n        import "google/protobuf/timestamp.proto";\n        import public "common/types.proto";
syntax.expected.import.location=Expected the path of the imported file as a quoted string but found ''{0}''
syntax.expected.import.location.help=Write the path of the file between double quotes. Paths are relative to the root of the proto\n      source tree.\n      Example:\n        import "google/protobuf/timestamp.proto";
syntax.expected.message.literal.key=Expected a field name or '''}''' in the message literal but found ''{0}''\n\nA message literal is a list of field names and values enclosed in braces.
syntax.expected.message.literal.key.help=Write each field as: name: value, and close the literal with a brace.\n      Example:\n        option (my_option) = '{' name: "example" count: 42 '}';
syntax.invalid.option.value=Invalid option value ''{0}''\n\nAn option value must be a number, a quoted string, ''true'', ''false'', the name of an enum constant, or a message literal enclosed in braces.
syntax.invalid.option.value.help=Write the value as one of the supported literals.\n      Examples:\n        option java_package = "com.example.api";\n        option optimize_for = SPEED;\n        option (my_option) = '{' name: "example" '}';

# Semantic errors
semantic.duplicate.file=File {0} has the same name as {1}\n\nFiles in a directory tree are identified by their file name, so two files cannot have the same name even if they are in different directories. Only {1} is compiled.
semantic.duplicate.file.help=Rename one of the files, or move it out of the directory being compiled.
semantic.duplicate.package=Duplicate package declaration\n\nThis file already declares package ''{0}'', which is the one that is used. A file can declare its package only once.
semantic.duplicate.package.help=Remove the additional ''package'' declaration. To group related types, use nested messages, or\n      move the types to a separate file with its own package.\n      Example:\n        package com.example.api;
semantic.syntax.not.first=The syntax declaration must be the first statement of the file\n\nThe syntax declaration determines how the rest of the file is interpreted, so it must appear before any other declaration. Only comments can precede it.
semantic.syntax.not.first.help=Move the syntax declaration to the top of the file.\n      Example:\n        syntax = "proto3";\n\n        package com.example.api;
semantic.edition.not.first=The edition declaration must be the first statement of the file\n\nThe edition declaration determines how the rest of the file is interpreted, so it must appear before any other declaration. Only comments can precede it.
semantic.edition.not.first.help=Move the edition declaration to the top of the file.\n      Example:\n        edition = "2023";\n\n        package com.example.api;
semantic.visibility.requires.edition.2024=The ''{0}'' visibility modifier requires edition 2024\n\nThe ''export'' and ''local'' modifiers control whether a message or an enum can be used from other files. They were introduced in edition 2024.
semantic.visibility.requires.edition.2024.help=Declare the file as edition 2024, or remove ''{0}''.\n      Example:\n        edition = "2024";\n\n        {0} message Person '{' ... '}'
semantic.group.name.not.capitalized=Group name ''{0}'' must start with a capital letter\n\nThe name of a group is also the name of the message type it declares, while the name of the field is its lowercase form.
semantic.group.name.not.capitalized.help=Capitalize the first letter of the group name.\n      Example:\n        optional group Result = 1 '{'\n          optional string url = 2;\n        '}'
semantic.reserved.name.must.be.identifier=Reserved name "{0}" must not be quoted in files that use editions\n\nIn editions, reserved names are written as identifiers.
semantic.reserved.name.must.be.identifier.help=Remove the quotes around the name.\n      Example:\n        reserved {0};
semantic.reserved.name.must.be.literal=Reserved name ''{0}'' must be quoted in proto2 and proto3 files\n\nIn proto2 and proto3, reserved names are written as string literals. Unquoted names are only allowed in files that use editions.
semantic.reserved.name.must.be.literal.help=Write the name between double quotes.\n      Example:\n        reserved "{0}";
semantic.weak.import.in.edition.2024=Weak imports are not allowed in edition 2024\n\nEdition 2024 removed weak imports.
semantic.weak.import.in.edition.2024.help=Use a regular import. If the file is only needed for the custom options it defines, use an option\n      import instead.\n      Examples:\n        import "other.proto";\n        import option "my_options.proto";
semantic.option.import.requires.edition.2024=Option imports require edition 2024\n\nOption imports, which import a file only for the custom options it defines, were introduced in edition 2024.
semantic.option.import.requires.edition.2024.help=Use a regular import, or declare the file as edition 2024.\n      Example:\n        import "my_options.proto";
semantic.unresolved.import=Cannot find the imported file ''{0}''\n\nImports are resolved against the other files being compiled and the well known types bundled with the compiler.
semantic.unresolved.import.help=Check the path for typos. Paths are relative to the root of the proto source tree, not to the\n      importing file, and the imported file must be part of the compilation.\n      Example:\n        import "google/protobuf/timestamp.proto";
semantic.duplicate.type.name=Duplicate type name ''{0}''\n\nAnother top level message, enum or service of this file already uses this name.
semantic.duplicate.type.name.help=Rename one of the declarations, or remove the duplicate.
semantic.duplicate.field.name=Duplicate field name ''{0}''\n\nAnother field or nested declaration of this message already uses this name. Fields, oneofs, nested messages, nested enums and their constants share the same namespace.
semantic.duplicate.field.name.help=Rename one of the fields. Renaming a field does not change the binary encoding, which only uses\n      field numbers.
semantic.duplicate.json.field.name=The JSON name ''{1}'' of field ''{0}'' is already used by field ''{2}''\n\nThe JSON name of a field is its name converted to lowerCamelCase, unless it is set with the json_name option. Two fields of the same message cannot have the same JSON name.
semantic.duplicate.json.field.name.help=Rename one of the two fields, or give one of them a distinct JSON name.\n      Example:\n        string {0} = 1 [json_name = "customName"];
semantic.duplicate.field.index=Field number {1,number,#} of ''{0}'' is already used by field ''{2}''\n\nField numbers identify fields in the binary encoding, so they must be unique within a message, including the fields of its oneofs.
semantic.duplicate.field.index.help=Assign an unused number to ''{0}''. If ''{2}'' was meant to be replaced, delete it and reserve its\n      name and number, so that they cannot be reused by mistake.
semantic.duplicate.name=Duplicate name ''{0}''\n\nFields, oneofs, nested messages, nested enums and their constants share the same namespace within a message.
semantic.duplicate.name.help=Rename one of the declarations.
semantic.extension.range.overlaps.reserved.range=Reserved numbers {0} overlap the extension range {1} of this message\n\nA number cannot be both reserved and available to extensions.
semantic.extension.range.overlaps.reserved.range.help=Remove the overlapping numbers from either the reserved declaration or the extension range.\n      Example:\n        reserved 1 to 99;\n        extensions 100 to 199;
semantic.reserved.range.overlaps.extension.range=Extension range {0} overlaps the numbers {1} reserved by this message\n\nA number cannot be both reserved and available to extensions.
semantic.reserved.range.overlaps.extension.range.help=Remove the overlapping numbers from either the extension range or the reserved declaration.\n      Example:\n        reserved 1 to 99;\n        extensions 100 to 199;
semantic.reserved.field.name=Field name ''{0}'' is reserved\n\nThe message reserves this name, usually because a field with this name was deleted: reusing it could break the compatibility of the JSON and text formats.
semantic.reserved.field.name.help=Rename the field. If the name was reserved by mistake, remove it from the reserved declaration.
semantic.reserved.field.index=Field ''{1}'' uses field number {0,number,#}, which is reserved\n\nThe message reserves this number, usually because a field that used it was deleted. Reusing it would make new code misinterpret data written by older versions.
semantic.reserved.field.index.help=Assign a number that is neither used nor reserved. If the number was reserved by mistake, remove it\n      from the reserved declaration.
semantic.extensible.field.index=Field ''{1}'' uses field number {0,number,#}, which is inside the extension range {2} of this message\n\nThe numbers of an extension range are set aside for the fields declared in extend blocks, so regular fields cannot use them.
semantic.extensible.field.index.help=Assign ''{1}'' a number outside of the extension range {2}, or shrink the extension range.
semantic.unresolved.extend.target=Cannot find the extended message ''{0}''\n\nNo message with this name is defined in this file or in the files it imports.
semantic.unresolved.extend.target.help=Check the name for typos, import the file that defines the message, and qualify its name with\n      its package if it is declared in another package.\n      Example:\n        import "google/protobuf/descriptor.proto";\n\n        extend google.protobuf.FieldOptions '{'\n          optional string my_option = 50000;\n        '}'
semantic.invalid.extend.target=''{0}'' is not a message and cannot be extended\n\nOnly messages and groups can be extended. Enums and services cannot.
semantic.invalid.extend.target.help=Extend a message that declares an extension range.\n      Example:\n        message Person '{'\n          extensions 100 to 199;\n        '}'\n\n        extend Person '{'\n          optional string nickname = 100;\n        '}'
semantic.required.extension.field=Extension field ''{0}'' cannot be required\n\nCode that does not know about an extension can never set it, so an extension cannot be required.
semantic.required.extension.field.help=Replace the ''required'' label with ''optional''.\n      Example:\n        extend Person '{'\n          optional string {0} = 100;\n        '}'
semantic.map.extension.field=Extension field ''{0}'' cannot be a map\n\nMap fields are not allowed in extensions.
semantic.map.extension.field.help=Use a repeated message field that holds a key and a value instead.\n      Example:\n        message Entry '{'\n          optional string key = 1;\n          optional int32 value = 2;\n        '}'\n\n        extend Person '{'\n          repeated Entry {0} = 100;\n        '}'
semantic.extension.field.outside.ranges=Extension field ''{0}'' uses number {1,number,#}, which is outside of the extension ranges of ''{2}''\n\nAn extension field must use a number that the extended message declares in one of its extension ranges. The extension ranges of ''{2}'' are: {3}.
semantic.extension.field.outside.ranges.help=Choose a number inside one of the extension ranges of ''{2}'', or add a range that covers\n      {1,number,#} to it.\n      Example:\n        message {2} '{'\n          extensions {1,number,#};\n        '}'
semantic.extension.field.outside.ranges.none=Extension field ''{0}'' extends ''{2}'', which declares no extension ranges\n\nA message can only be extended if it declares at least one extension range, and each extension field must use a number inside one of them.
semantic.extension.field.outside.ranges.none.help=Add an extension range that covers {1,number,#} to ''{2}''.\n      Example:\n        message {2} '{'\n          extensions {1,number,#};\n        '}'
semantic.features.require.editions=Features can only be set in files that use editions\n\nThe ''features'' option configures the behavior of editions and has no meaning in proto2 or proto3 files.
semantic.features.require.editions.help=Declare the file with an edition, or remove the feature and use the equivalent proto2 or proto3\n      construct.\n      Example:\n        edition = "2023";\n\n        option features.field_presence = IMPLICIT;
semantic.repeated.field.presence=Repeated field ''{0}'' cannot set the field_presence feature\n\nPresence tracks whether a singular field was set. A repeated field is either empty or not, so presence does not apply to it.
semantic.repeated.field.presence.help=Remove the field_presence feature from the repeated field.
semantic.ctype.in.edition.2024=Field ''{0}'' uses the ctype option, which is not allowed in edition 2024 and later\n\nEdition 2024 replaced the ctype option with the C++ string_type feature.
semantic.ctype.in.edition.2024.help=Use the string_type feature instead.\n      Example:\n        string {0} = 1 [features.(pb.cpp).string_type = CORD];
semantic.default.value.in.proto3=Field ''{0}'' cannot have a default value in proto3\n\nIn proto3, every field defaults to the zero value of its type: 0, false, the empty string, or the first constant of an enum.
semantic.default.value.in.proto3.help=Remove the default option and apply the default value in the application code, or switch the\n      file to proto2 or to an edition.
semantic.default.value.with.implicit.presence=Field ''{0}'' cannot have a default value because it has implicit presence\n\nA field with implicit presence is not written when it holds its default value, so a custom default would be indistinguishable from an unset field.
semantic.default.value.with.implicit.presence.help=Remove the default option, or give the field explicit presence.\n      Example:\n        int32 retries = 1 [default = 3, features.field_presence = EXPLICIT];
semantic.default.value.on.repeated.field=Repeated field ''{0}'' cannot have a default value\n\nThe default value of a repeated field is always the empty list.
semantic.default.value.on.repeated.field.help=Remove the default option.
semantic.default.value.on.invalid.type=Field ''{0}'' of type {1} cannot have a default value\n\nOnly fields of a scalar or enum type can declare a default value.
semantic.default.value.on.invalid.type.help=Remove the default option.
semantic.default.value.type.mismatch=The default value {2} of field ''{0}'' is not a valid {1} value
semantic.default.value.type.mismatch.help=Use a value that matches the type of the field:\n      * a number for integer and floating point types; floating point types also accept inf and nan\n      * true or false for bool\n      * a quoted string for string and bytes\n      * the name of one of its constants for an enum\n      Example:\n        optional int32 retries = 1 [default = 3];
semantic.default.value.unknown.enum.constant=The default value ''{0}'' is not a constant of enum ''{1}''
semantic.default.value.unknown.enum.constant.help=Use the name of one of the constants declared in ''{1}'', without qualifying it with the name of\n      the enum.\n      Example:\n        optional Status status = 1 [default = STATUS_ACTIVE];
semantic.default.value.out.of.range=The default value {0,number,#} of field ''{1}'' is out of range for type {2}\n\nValues of type {2} must be between {3} and {4}.
semantic.default.value.out.of.range.help=Use a value within the range of the type, or change the type of the field to one that can hold\n      {0,number,#}.
semantic.packed.in.editions=Field ''{0}'' uses the packed option, which is not allowed in files that use editions\n\nIn editions, repeated scalar fields are packed by default, and their encoding is controlled with the repeated_field_encoding feature.
semantic.packed.in.editions.help=Remove the packed option. To use the expanded encoding, set the feature instead.\n      Example:\n        repeated int32 {0} = 1 [features.repeated_field_encoding = EXPANDED];
semantic.packed.on.non.repeated.field=Field ''{0}'' is not repeated, so it cannot use the packed option
semantic.packed.on.non.repeated.field.help=Remove the packed option, or make the field repeated.\n      Example:\n        repeated int32 {0} = 1 [packed = true];
semantic.packed.on.non.packable.field=Field ''{0}'' of type {1} cannot use the packed option\n\nOnly repeated fields of a numeric, bool or enum type can be packed. Strings, bytes and messages are length delimited.
semantic.packed.on.non.packable.field.help=Remove the packed option from this field.
semantic.json.name.not.string=The json_name option of field ''{0}'' must be a string, but its value is {1}
semantic.json.name.not.string.help=Write the JSON name between double quotes.\n      Example:\n        string {0} = 1 [json_name = "customName"];
semantic.unresolved.field.type=Cannot find type ''{0}'' used by field ''{1}''\n\nNo message or enum with this name is defined in this file or in the files it imports, and it is not a scalar type.
semantic.unresolved.field.type.help=Check the type:\n      * a scalar type must be one of: double, float, int32, int64, uint32, uint64, sint32, sint64,\n        fixed32, fixed64, sfixed32, sfixed64, bool, string, bytes\n      * a type defined in another file requires an import of that file\n      * a type defined in another package must be qualified with the package name\n      Example:\n        import "google/protobuf/timestamp.proto";\n\n        google.protobuf.Timestamp created_at = 1;
semantic.unresolved.field.type.nested=Cannot find type ''{0}'' used by field ''{1}'' of ''{2}''\n\nNo message or enum with this name is defined in this file or in the files it imports, and it is not a scalar type.
semantic.unresolved.field.type.nested.help=Check the type:\n      * a scalar type must be one of: double, float, int32, int64, uint32, uint64, sint32, sint64,\n        fixed32, fixed64, sfixed32, sfixed64, bool, string, bytes\n      * a type defined in another file requires an import of that file\n      * a type defined in another package must be qualified with the package name\n      Example:\n        import "google/protobuf/timestamp.proto";\n\n        google.protobuf.Timestamp created_at = 1;
semantic.unresolved.map.key.type=Cannot find type ''{0}'' used as the key of map field ''{1}''\n\nThe key of a map must be an integral or string scalar type.
semantic.unresolved.map.key.type.help=Use one of the valid key types: int32, int64, uint32, uint64, sint32, sint64, fixed32, fixed64,\n      sfixed32, sfixed64, bool or string.\n      Example:\n        map<string, int32> scores = 1;
semantic.unresolved.map.value.type=Cannot find type ''{0}'' used as the value of map field ''{1}''\n\nNo message or enum with this name is defined in this file or in the files it imports, and it is not a scalar type.
semantic.unresolved.map.value.type.help=Check the type for typos, import the file that defines it, and qualify it with its package if\n      it is declared in another package.\n      Example:\n        import "google/protobuf/timestamp.proto";\n\n        map<string, google.protobuf.Timestamp> last_seen = 1;
semantic.unknown.custom.option=Unknown custom option ''({0})''\n\nNo extension named ''{0}'' of {1} is visible from this file.
semantic.unknown.custom.option.help=Import the file that declares the custom option, and check that the option extends {1}, which\n      holds the options of this kind of declaration.\n      Example:\n        import "my_options.proto";\n\n        option ({0}) = true;
semantic.unknown.option=Unknown option ''{0}'' for {1}\n\nThe built in options of a declaration are the fields of its options message, {1}, which is defined in google/protobuf/descriptor.proto.
semantic.unknown.option.help=Check the name for typos, and check that the option applies to this kind of declaration. The names\n      of custom options must be enclosed in parentheses.\n      Examples:\n        option java_package = "com.example.api";\n        option (my_option) = true;
semantic.unresolved.option.field=Cannot find field ''{0}'' in option ''{1}''\n\nThe option name selects a field that does not exist in the type of the part of the name that precedes it.
semantic.unresolved.option.field.help=Check the name of the field for typos. The names of extensions must be enclosed in parentheses.\n      Example:\n        option (my_option).enabled = true;
semantic.option.value.type.mismatch=The value {2} of option ''{0}'' is not a valid {1} value
semantic.option.value.type.mismatch.help=Use a value that matches the type of the option:\n      * a number for integer and floating point types; floating point types also accept inf and nan\n      * true or false for bool\n      * a quoted string for string and bytes\n      * the name of one of its constants for an enum\n      * a message literal enclosed in braces for a message or a group\n      Example:\n        option (my_option) = '{' name: "example" count: 42 '}';
semantic.option.value.unknown.enum.constant=The value ''{0}'' is not a constant of enum ''{1}''
semantic.option.value.unknown.enum.constant.help=Use the name of one of the constants declared in ''{1}'', without qualifying it with the name of\n      the enum.\n      Example:\n        option optimize_for = SPEED;
semantic.option.value.out.of.range=The value {0,number,#} of option ''{1}'' is out of range for type {2}\n\nValues of type {2} must be between {3} and {4}.
semantic.option.value.out.of.range.help=Use a value within the range of the type of the option.
semantic.option.value.on.map.field=Option ''{0}'' has a map type and cannot be assigned a value\n\nMap fields cannot be set with an option statement.
semantic.option.value.on.map.field.help=Remove the option, or change the definition of the custom option to use a repeated message field\n      instead of a map.
semantic.missing.label.in.proto2=Field ''{0}'' must have a label in proto2\n\nIn proto2, every field outside of a oneof must be declared as ''optional'', ''required'' or ''repeated''. Map fields are the only exception.
semantic.missing.label.in.proto2.help=Add a label before the type of the field. Prefer ''optional'' over ''required'': a required field\n      can never be removed without breaking compatibility.\n      Example:\n        optional string {0} = 1;
semantic.required.in.proto3=Field ''{0}'' cannot be required in proto3\n\nproto3 removed required fields because adding or removing them later breaks compatibility with existing data.
semantic.required.in.proto3.help=Remove the ''required'' label and check the value in the application code. To track whether the\n      field was set, declare it as ''optional''.\n      Example:\n        optional string {0} = 1;
semantic.required.in.editions=Field ''{0}'' cannot use the ''required'' label in files that use editions\n\nIn editions, labels are replaced by the field_presence feature.
semantic.required.in.editions.help=Remove the label and set the field presence to LEGACY_REQUIRED.\n      Example:\n        string {0} = 1 [features.field_presence = LEGACY_REQUIRED];
semantic.optional.in.editions=Field ''{0}'' cannot use the ''optional'' label in files that use editions\n\nIn editions, singular fields have explicit presence by default, so the label is not needed.
semantic.optional.in.editions.help=Remove the ''optional'' label. To opt out of explicit presence, use the field_presence feature.\n      Examples:\n        string {0} = 1;\n        string {0} = 1 [features.field_presence = IMPLICIT];
semantic.map.field.in.oneof=Map field ''{0}'' cannot be declared in oneof ''{1}''
semantic.map.field.in.oneof.help=Move ''{0}'' out of the oneof, or wrap the map in a message and use that message in the oneof.\n      Example:\n        message Scores '{'\n          map<string, int32> values = 1;\n        '}'\n\n        oneof {1} '{'\n          Scores scores = 1;\n        '}'
semantic.map.field.with.modifier=Map field ''{0}'' cannot use the ''{1}'' label\n\nMap fields are implicitly repeated, so they cannot have a label.
semantic.map.field.with.modifier.help=Remove the ''{1}'' label.\n      Example:\n        map<string, int32> {0} = 1;
semantic.invalid.map.key.type=Map field ''{0}'' cannot use {1} as its key type\n\nThe key of a map must be an integral or string type. Floating point types, bytes, enums and messages cannot be used as keys.
semantic.invalid.map.key.type.help=Use one of the valid key types: int32, int64, uint32, uint64, sint32, sint64, fixed32, fixed64,\n      sfixed32, sfixed64, bool or string. To index a map by an enum, use the value of the constant as an\n      int32 key.\n      Example:\n        map<string, int32> {0} = 1;
semantic.nested.map.value=Map field ''{0}'' cannot use another map as its value type\n\nMaps cannot be nested directly.
semantic.nested.map.value.help=Wrap the inner map in a message and use that message as the value type.\n      Example:\n        message InnerMap '{'\n          map<string, int32> values = 1;\n        '}'\n\n        map<string, InnerMap> {0} = 1;
semantic.field.number.too.small=Field ''{0}'' uses invalid field number {1,number,#}\n\nField numbers must be positive: the smallest valid field number is 1.
semantic.field.number.too.small.help=Assign a number between 1 and 536870911 that is unique within the message.\n      Example:\n        string {0} = 1;
semantic.field.number.too.large=Field ''{0}'' uses invalid field number {1,number,#}\n\nThe largest valid field number is 536870911, which is 2^29 minus 1.
semantic.field.number.too.large.help=Assign a smaller number that is unique within the message. If the message needs this many fields,\n      consider splitting it into smaller messages.
semantic.field.number.in.implementation.range=Field ''{0}'' uses field number {1,number,#}, which is reserved for the Protocol Buffers implementation\n\nThe field numbers from 19000 to 19999 are reserved and cannot be used.
semantic.field.number.in.implementation.range.help=Assign a number outside of the range from 19000 to 19999.
semantic.enum.value.out.of.range=Value {0,number,#} of constant ''{4}'' of enum ''{3}'' is out of range\n\nEnum values are encoded as int32, so they must be between {1,number,#} and {2,number,#}.
semantic.enum.value.out.of.range.help=Assign a value within the range of int32.
semantic.group.in.proto3=Group ''{0}'' is not allowed in proto3\n\nGroups are a deprecated proto2 feature.
semantic.group.in.proto3.help=Replace the group with a nested message and a field of that type.\n      Example:\n        message {0} '{'\n          string url = 1;\n        '}'\n\n        {0} value = 1;
semantic.group.in.editions=Group ''{0}'' is not allowed in files that use editions\n\nIn editions, the group encoding is available to regular message fields through the message_encoding feature.
semantic.group.in.editions.help=Replace the group with a nested message and a field of that type, and set the delimited encoding\n      on the field to keep the same wire format.\n      Example:\n        message {0} '{'\n          string url = 1;\n        '}'\n\n        {0} value = 1 [features.message_encoding = DELIMITED];
semantic.empty.oneof=Oneof ''{0}'' must contain at least one field
semantic.empty.oneof.help=Add fields to the oneof, or remove it.\n      Example:\n        oneof {0} '{'\n          string name = 1;\n          int32 id = 2;\n        '}'
semantic.empty.enum=Enum ''{0}'' must declare at least one constant
semantic.empty.enum.help=Add a constant. By convention, the first constant has value 0 and represents an unspecified value.\n      Example:\n        enum {0} '{'\n          UNSPECIFIED = 0;\n        '}'
semantic.open.enum.first.value.not.zero=The first constant of enum ''{0}'', ''{2}'', must have value 0\n\n''{0}'' is an open enum: its first constant is its default value, which must be 0. ''{2}'' has value {1,number,#}.
semantic.open.enum.first.value.not.zero.help=Add a constant with value 0 at the top of the enum.\n      Example:\n        enum {0} '{'\n          UNSPECIFIED = 0;\n        '}'
semantic.duplicate.enum.constant.name=Duplicate enum constant name ''{0}''\n\nTwo constants of the same enum cannot have the same name.
semantic.duplicate.enum.constant.name.help=Rename one of the constants.
semantic.reserved.enum.constant.name=Enum constant name ''{0}'' is reserved\n\nThe enum reserves this name, usually because a constant with this name was deleted.
semantic.reserved.enum.constant.name.help=Rename the constant. If the name was reserved by mistake, remove it from the reserved declaration.
semantic.reserved.enum.constant.index=Constant ''{1}'' uses value {0,number,#}, which is reserved\n\nThe enum reserves this value, usually because a constant that used it was deleted. Reusing it would make new code misinterpret data written by older versions.
semantic.reserved.enum.constant.index.help=Assign a value that is neither used nor reserved. If the value was reserved by mistake, remove it\n      from the reserved declaration.
semantic.duplicate.enum.value=Value {1,number,#} is used by more than one constant of enum ''{0}'': {2}\n\nTwo constants can have the same value only if the enum allows aliases.
semantic.duplicate.enum.value.help=Assign a distinct value to each constant. If the constants are meant to be aliases of each other,\n      enable the allow_alias option.\n      Example:\n        enum {0} '{'\n          option allow_alias = true;\n        '}'
semantic.duplicate.reserved.name=Name ''{0}'' is reserved more than once
semantic.duplicate.reserved.name.help=Remove the duplicate name from the reserved declarations.
semantic.reserved.number.too.small=Reserved number {0,number,#} is invalid: the smallest valid number is {1,number,#}
semantic.reserved.number.too.small.help=Reserve only numbers that could be assigned.
semantic.reserved.number.too.large=Reserved number {0,number,#} is invalid: the largest valid number is {1,number,#}
semantic.reserved.number.too.large.help=Reserve only numbers that could be assigned. To reserve every number from a given start, use\n      ''max'' as the end of the range.\n      Example:\n        reserved 1000 to max;
semantic.invalid.reserved.range=Invalid reserved range from {0,number,#} to {1,number,#}: the start is greater than the end
semantic.invalid.reserved.range.help=Write the smaller number first.\n      Example:\n        reserved {1,number,#} to {0,number,#};
semantic.reserved.ranges.overlap=Reserved numbers {0} overlap the numbers {1} that are already reserved\n\nEach number can be reserved only once.
semantic.reserved.ranges.overlap.help=Remove the overlapping numbers, or merge the overlapping ranges into a single range.\n      Example:\n        reserved 9 to 15;
semantic.mixed.reserved.numbers.and.names=A reserved declaration cannot contain both numbers and names
semantic.mixed.reserved.numbers.and.names.help=Split it into two declarations.\n      Example:\n        reserved 2, 15, 9 to 11;\n        reserved "foo", "bar";
semantic.extensions.in.proto3=Message ''{0}'' cannot declare extension ranges in proto3\n\nIn proto3, extensions can only be used to define custom options, by extending the options messages of google/protobuf/descriptor.proto.
semantic.extensions.in.proto3.help=To carry arbitrary data, use a google.protobuf.Any field instead. To keep using extensions, switch\n      the file to proto2 or to an edition.\n      Example:\n        import "google/protobuf/any.proto";\n\n        google.protobuf.Any details = 1;
semantic.extension.number.too.small=Extension number {0,number,#} is invalid: the smallest valid field number is {1,number,#}
semantic.extension.number.too.small.help=Use only valid field numbers in extension ranges.\n      Example:\n        extensions 100 to 199;
semantic.extension.number.too.large=Extension number {0,number,#} is invalid: the largest valid field number is {1,number,#}
semantic.extension.number.too.large.help=Use only valid field numbers in extension ranges. To make every number from a given start\n      available to extensions, use ''max'' as the end of the range.\n      Example:\n        extensions 1000 to max;
semantic.invalid.extension.range=Invalid extension range from {0,number,#} to {1,number,#}: the start is greater than the end
semantic.invalid.extension.range.help=Write the smaller number first.\n      Example:\n        extensions {1,number,#} to {0,number,#};
semantic.extension.ranges.overlap=Extension range {0} overlaps the extension range {1} of this message\n\nEach number can belong to only one extension range.
semantic.extension.ranges.overlap.help=Remove the overlapping numbers, or merge the overlapping ranges into a single range.\n      Example:\n        extensions 100 to 199;
semantic.duplicate.method.name=Duplicate method name ''{0}'' in service ''{1}''
semantic.duplicate.method.name.help=Rename one of the methods, or remove the duplicate.
semantic.unresolved.method.type=Cannot find type ''{0}'' used by method ''{1}'' of service ''{2}''\n\nNo message with this name is defined in this file or in the files it imports.
semantic.unresolved.method.type.help=Check the name for typos, import the file that defines the message, and qualify it with its\n      package if it is declared in another package. To send or receive no data, use\n      google.protobuf.Empty.\n      Example:\n        import "google/protobuf/empty.proto";\n\n        rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
semantic.enum.method.input=Method ''{0}'' of service ''{1}'' uses an enum as its request type\n\nThe request and the response of a method must be messages.
semantic.enum.method.input.help=Wrap the enum in a message.\n      Example:\n        message {0}Request '{'\n          Status status = 1;\n        '}'\n\n        rpc {0}({0}Request) returns ({0}Response);
semantic.enum.method.output=Method ''{0}'' of service ''{1}'' uses an enum as its response type\n\nThe request and the response of a method must be messages.
semantic.enum.method.output.help=Wrap the enum in a message.\n      Example:\n        message {0}Response '{'\n          Status status = 1;\n        '}'\n\n        rpc {0}({0}Request) returns ({0}Response);
semantic.package.segment.not.snake.case=Package name segment ''{0}'' must be lower_snake_case\n\nThis file enforces the 2024 naming style, which requires package names made of lowercase words separated by underscores.
semantic.package.segment.not.snake.case.help=Rename the package, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.message.name.not.title.case=Message name ''{0}'' must be TitleCase\n\nThis file enforces the 2024 naming style, which requires message names made only of letters and digits, starting with an uppercase letter.
semantic.message.name.not.title.case.help=Rename the message, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.enum.name.not.title.case=Enum name ''{0}'' must be TitleCase\n\nThis file enforces the 2024 naming style, which requires enum names made only of letters and digits, starting with an uppercase letter.
semantic.enum.name.not.title.case.help=Rename the enum, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.service.name.not.title.case=Service name ''{0}'' must be TitleCase\n\nThis file enforces the 2024 naming style, which requires service names made only of letters and digits, starting with an uppercase letter.
semantic.service.name.not.title.case.help=Rename the service, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.method.name.not.title.case=Method name ''{0}'' must be TitleCase\n\nThis file enforces the 2024 naming style, which requires method names made only of letters and digits, starting with an uppercase letter.
semantic.method.name.not.title.case.help=Rename the method, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.field.name.not.snake.case=Field name ''{0}'' must be lower_snake_case\n\nThis file enforces the 2024 naming style, which requires field names made of lowercase words separated by single underscores, where each word starts with a letter.
semantic.field.name.not.snake.case.help=Rename the field, or opt out of the naming style. Renaming a field does not change the binary\n      encoding, which only uses field numbers.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.oneof.name.not.snake.case=Oneof name ''{0}'' must be lower_snake_case\n\nThis file enforces the 2024 naming style, which requires oneof names made of lowercase words separated by single underscores, where each word starts with a letter.
semantic.oneof.name.not.snake.case.help=Rename the oneof, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
semantic.enum.value.not.upper.snake.case=Enum constant name ''{0}'' must be UPPER_SNAKE_CASE\n\nThis file enforces the 2024 naming style, which requires enum constant names made of uppercase words separated by single underscores, where each word starts with a letter.
semantic.enum.value.not.upper.snake.case.help=Rename the constant, or opt out of the naming style.\n      Example:\n        option features.enforce_naming_style = STYLE_LEGACY;
