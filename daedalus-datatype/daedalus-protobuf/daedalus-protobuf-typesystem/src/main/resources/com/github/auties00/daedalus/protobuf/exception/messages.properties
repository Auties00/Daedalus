# Root (English) messages of the Protocol Buffer serialization and deserialization exceptions.
#
# Every value is a java.text.MessageFormat pattern:
#   - a literal apostrophe is written as ''
#   - a literal brace is written as '{' or '}'
#   - integers are formatted with {n,number,#} so that no grouping separator is inserted

# Deserialization
deserialization.truncated.message=A message ended unexpectedly
deserialization.malformed.var.int=A message contained a malformed var int
deserialization.invalid.wire.type=A message contained an invalid wire type: {0,number,#}
deserialization.invalid.end.object=A message closed a group with index {0,number,#}, but the previously opened group had index {1,number,#}
deserialization.invalid.start.object=A message expected a group to open at index {0,number,#}
deserialization.recursion.limit.exceeded=The input nests messages or groups more than {0,number,#} levels deep, which is the recursion limit of the reader, so decoding stopped to prevent a stack overflow that a malicious input could cause; if the input is trusted and legitimately this deep, raise the limit with setRecursionLimit
deserialization.unmatched.end.group=A message closed a group with index {0,number,#} that was never opened, so the input is malformed, truncated, or not a message of the expected type, and decoding stopped instead of dropping the bytes that follow; check that the input is a complete message of the type being decoded
deserialization.malformed.group=A message opened a group but didn''t close it
deserialization.negative.length=A message specified a negative block length for a length delimited field: {0,number,#}
deserialization.invalid.field.index=A message specified an invalid field index: {0,number,#}
deserialization.invalid.utf8=String field contains invalid UTF-8 data
deserialization.field.tag.already.read=Invalid field state: a field tag was already read
deserialization.missing.field.tag=Invalid field state: no field tag
deserialization.length.delimited.field.overflow=Message size({0,number,#}) is too large to be deserialized
deserialization.expected.message.start=Expected '''{''' or ''<'' to open a nested message, but found "{0}": the value of a message field must be enclosed in braces or angle brackets
deserialization.expected.message.end=Expected "{0}" to close a nested message, but found "{1}": a message opened by a brace must be closed by a brace, and one opened by an angle bracket by an angle bracket
deserialization.expected.end.of.text=Expected the end of the text after the top level message, but found "{0}": the text closes a message that was never opened, or has content after its last field
deserialization.expected.field.name=Expected the name of a field, or the name of an extension enclosed in square brackets, but found "{0}"
deserialization.unexpected.end.of.text=The text ended in the middle of a message: a nested message, a list or a value is not complete, so the input is truncated or malformed
deserialization.binary.only.field=Cannot write the field {0} in the text format, because its value is converted by {1}, which writes the binary format directly; declare an overload of {1} that takes a ProtobufTextWriter instead of a ProtobufBinaryWriter, or clear the field before writing the message in the text format
serialization.unmatched.end.message=Cannot close a message, because no message is open: every call to readEndMessage must follow a call to readStartMessage
deserialization.unknown.field=The message {0} has no field named "{1}": the text sets a field that the type does not declare, which is misspelled or was added by a newer version of the schema; fix the name, or declare a field annotated with @ProtobufMessage.UnknownFields in the message to keep the fields it does not declare
deserialization.binary.only.field=Cannot read the field {1} of the message {0} from the text format, because its value is converted by {2}, which reads the binary format directly; declare an overload of {2} that takes a ProtobufTextReader instead of a ProtobufBinaryReader to read the field from the text format
deserialization.unknown.enum.constant=The enum {0} has no constant named "{1}": the text sets an enum field to a name that the type does not declare, which is misspelled or was added by a newer version of the schema; fix the name, or write the number of the value instead
deserialization.unterminated.block=Unterminated block
deserialization.unterminated.string=Unterminated string
deserialization.expected.numeric.value=Expected numeric value
deserialization.integer.overflow=Integer overflow
deserialization.expected.hex.digits=Expected hex digits after 0x prefix
deserialization.expected.value=Expected {0} value
deserialization.expected.value.found=Expected {0} value, got: {1}
deserialization.expected.boolean.number=Expected boolean numeric value (0 or 1)
deserialization.expected.boolean.number.found=Expected boolean numeric value (0 or 1), got: {0}
deserialization.octal.floating.point=Octal literals are not valid for {0} fields: {1}
deserialization.invalid.floating.point=Invalid {0} value: {1}
deserialization.value.out.of.range=Value out of range for {0}
deserialization.missing.required.field=Cannot decode the message {0}, because the input does not set its required field {1}: the input was written by an encoder that did not set the field, or it does not encode a message of this type; decode it partially to read the fields that are set

# Builders
uninitialized.missing.required.field=Cannot build the message {0}, because its required field {1} is not set; set the field before building the message, or build it partially to skip the check

# Serialization
serialization.underflow=Underflow
serialization.overflow=Overflow
serialization.negative.length=Cannot write a length delimited block with a negative length
serialization.output.stream.failure=Cannot write to output stream
serialization.converter.failure=Cannot serialize the message {0}, because a converter of one of its fields threw {1}: the converter rejected the value of the field, so the message cannot be written; fix the value, or the converter that rejects it
deserialization.converter.failure=Cannot decode the message {0}, because a converter of one of its fields threw {1}: the converter rejected the value read from the input, so the message cannot be built; fix the input, or the converter that rejects it
serialization.output.full=Cannot write the text format of the message, because it does not fit in the {0,number,#} characters or bytes of the output: the capacity of an array, a buffer or a segment is fixed; use a larger output, or a writer whose output grows, like the one returned by ProtobufTextWriter.toString
serialization.text.too.large=Cannot encode the text format of the message as a string, because its UTF-8 encoding takes {0,number,#} bytes, more than the {1,number,#} bytes an array can hold: the message holds too much data to be returned at once; write it to a stream with ProtobufTextWriter.toStream instead
serialization.unmatched.end.message=Cannot close a message, because no message is open: every call to writeEndMessageField must follow a call to writeStartMessageField
serialization.null.repeated.element=Cannot serialize the repeated field {0}, which contains a null element: the wire format cannot represent it, and skipping it would change the number and the positions of the elements; remove the null elements before serializing
serialization.null.map.key=Cannot serialize the map field {0}, which contains a null key: the wire format cannot represent it; remove the entry or replace the key before serializing
serialization.null.map.value=Cannot serialize the map field {0}, which contains a null value: writing the key alone would decode as the default value of the value type; remove the entry or replace the value before serializing
serialization.missing.required.field=Cannot serialize a message whose required field {0} is not set
