name: Nightly CLI

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if nothing changed in the last 24 hours"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]] \
              || [[ -n "$(git log --since='24 hours ago' --oneline)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            graalvm: linux-x64_bin.tar.gz
          - os: ubuntu-24.04-arm
            graalvm: linux-aarch64_bin.tar.gz
          - os: macos-13
            graalvm: macos-x64_bin.tar.gz
          - os: macos-latest
            graalvm: macos-aarch64_bin.tar.gz
          - os: windows-latest
            graalvm: windows-x64_bin.zip
    runs-on: ${{ matrix.os }}
    env:
      # The newest Oracle GraalVM based on JDK 26: its early access build, as there is no release yet
      GRAALVM_BUILD: jdk-26.0.0-ea.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Install GraalVM
        shell: bash
        run: |
          file="graalvm-${GRAALVM_BUILD}_${{ matrix.graalvm }}"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/$GRAALVM_BUILD/$file"
          mkdir "$RUNNER_TEMP/graalvm"
          if [[ "$file" == *.zip ]]; then unzip -q "$RUNNER_TEMP/$file" -d "$RUNNER_TEMP/graalvm"; else tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/graalvm"; fi
          home="$(find "$RUNNER_TEMP/graalvm" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          [[ "$RUNNER_OS" == "macOS" ]] && home="$home/Contents/Home"
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
      - name: Build the CLI
        shell: bash
        run: bash daedalus-cli/scripts/build-cli.sh --label "nightly-$(date -u +%Y%m%d)" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated nightly build of the Daedalus CLI from commit $GITHUB_SHA. Each archive holds a a single self-contained native executable of the CLI with every datatype extension, so no Java installation is needed."
