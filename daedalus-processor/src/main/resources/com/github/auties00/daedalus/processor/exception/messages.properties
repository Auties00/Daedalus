classpath.unsupported.compiler=Cannot identify the compiler that created the processing environment {0}. It is not the processing environment of javac or of the Eclipse compiler, and it does not wrap one in its fields or in the invocation handler of a proxy. The supported compilers are javac, including when it is run by Maven, Gradle, IntelliJ IDEA or kapt, the batch Eclipse compiler, and the compiler of the Eclipse IDE.
classpath.unsupported.eclipse.compiler=The processing environment {0} of the Eclipse compiler exposes neither a file manager, as the batch Eclipse compiler does, nor a Java project, as the compiler of the Eclipse IDE does, so the locations of the compilation cannot be read. This version of the Eclipse compiler is not supported.
classpath.inaccessible.compiler=Cannot read the locations of the compilation from the internals of the compiler, reached through its processing environment {0}. {1}
classpath.unlistable.file.manager=The file manager {0} of the compilation cannot list the paths of its locations: it is not a javax.tools.StandardJavaFileManager, and none of its fields holds one that it delegates to. The build tool or IDE that installed this file manager is not supported.
